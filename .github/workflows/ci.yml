name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Install, Lint, Test, Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Unit tests (Jest)
        run: npm run test -- --ci --coverage

      - name: Component tests (Cypress)
        uses: cypress-io/github-action@v7
        with:
          install: false
          component: true

      - name: Build Storybook
        run: npm run build-storybook

      - name: Build app
        run: npm run build

      - name: Build library
        run: npm run build:lib

      - name: Upload Storybook artifact
        uses: actions/upload-artifact@v6
        with:
          name: storybook-static
          path: storybook-static
          retention-days: 7

      - name: Upload library dist artifact
        uses: actions/upload-artifact@v6
        with:
          name: dist
          path: dist
          retention-days: 7

  release:
    name: Publish to npm
    needs: build-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: npm ci

      - name: Build library
        run: npm run build:lib

      - name: Publish to npm
        run: |
          if npm view "$(node -p "require('./package.json').name")@$(node -p "require('./package.json').version")" version >/dev/null 2>&1; then
            echo "Version already published; skipping release."
          else
            npm publish --access public --provenance
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
